[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-rd-platform"
version = "0.1.0"
description = "Unified radar echo, RD/RA/RAD simulation and bounded dataset validation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.35",
  "pydantic>=2.10,<3",
  # MAROON's restricted legacy reader requires the validated NumPy 2.0-2.2 API.
  "numpy>=2.0,<2.3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "h5py>=3.11,<4",
  "gdown>=5.2,<6",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "py7zr>=0.22,<1",
]

[project.optional-dependencies]
presentation = ["imageio-ffmpeg>=0.6,<0.9"]
navigation = ["torch>=2.5,<2.6", "numba>=0.61,<0.62", "imageio-ffmpeg>=0.6,<0.8", "psutil>=7,<8"]
geo = ["rasterio>=1.4,<1.5", "pyproj>=3.6,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
radar-platform = "radar_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["local_data: integration check requiring explicitly prepared external/local research data"]
asyncio_mode = "auto"
